<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter Elite</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #03030f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 22px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
            color: #00ffff;
        }
        #gameCanvas {
            border: 3px solid #00ffff;
            background-color: #010105;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            max-width: 95vw;
            max-height: 72vh;
            border-radius: 12px;
        }
        .instructions {
            margin: 8px 0;
            font-size: 13px;
            color: #88aaee;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>METEOR SMASHER</h1>
    <canvas id="gameCanvas" width="360" height="540"></canvas>
    <div class="instructions">Left Side Drag: Move ship naturally | Right Side Tap: Shoot Lasers<br>Big meteors require multiple shots!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameOver = false;
        let score = 0;
        let speedMultiplier = 1;

        // Player Unit
        const player = {
            x: canvas.width / 2 - 16,
            y: canvas.height - 80,
            width: 32,
            height: 32,
            color: "#00ffff"
        };

        // Storage Trackers
        const obstacles = [];
        const lasers = [];
        const particles = [];
        
        const obstacleSpawnRate = 35; 
        let spawnTimer = 0;

        // --- RELATIVE STEERING INTERFACE ENGINE ---
        let lastTouchX = null;

        canvas.addEventListener("touchstart", (e) => {
            if (gameOver) {
                resetGame();
                return;
            }

            const rect = canvas.getBoundingClientRect();
            // Evaluate touches across multi-finger mapping targets
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const touchCanvasX = ((touch.clientX - rect.left) / rect.width) * canvas.width;

                if (touchCanvasX < canvas.width / 2) {
                    // Initialize steering baseline anchoring point on Left Thumb contact
                    lastTouchX = touchCanvasX;
                } else {
                    // Right Side Tap: Weapons Active
                    fireLaser();
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const touchCanvasX = ((touch.clientX - rect.left) / rect.width) * canvas.width;

                if (touchCanvasX < canvas.width / 2 && lastTouchX !== null) {
                    // Dynamic Delta Engine calculation: compute variance offset relative to frame displacement
                    const deltaX = touchCanvasX - lastTouchX;
                    player.x += deltaX * 1.5; // Smooth amplification modifier
                    lastTouchX = touchCanvasX;

                    // Restrict flight boundaries
                    if (player.x < 0) player.x = 0;
                    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            // Nullify reference trackers when left thumb disengages window canvas
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const rect = canvas.getBoundingClientRect();
                const touchCanvasX = ((touch.clientX - rect.left) / rect.width) * canvas.width;
                if (touchCanvasX < canvas.width / 2) {
                    lastTouchX = null;
                }
            }
        });

        function fireLaser() {
            lasers.push({
                x: player.x + player.width / 2 - 2, 
                y: player.y,
                width: 4,
                height: 16,
                speed: 11,
                color: "#ff00ff"
            });
        }

        function createExplosion(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 3 + 2,
                    alpha: 1,
                    color: color
                });
            }
        }

        function spawnObstacle() {
            const roll = Math.random();
            let size, hp, speedOffset, color, points;

            if (roll < 0.50) {
                // Fragile Fast Scout Asteroid
                size = 18; hp = 1; speedOffset = 3.5; color = "#ff5555"; points = 1;
            } else if (roll < 0.85) {
                // Standard Threat Rock
                size = 32; hp = 2; speedOffset = 2.2; color = "#ffaa00"; points = 3;
            } else {
                // Heavy Armor Threat Chunk
                size = 55; hp = 4; speedOffset = 1.2; color = "#dd00ee"; points = 10;
            }

            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                maxHp: hp,
                currentHp: hp,
                speed: speedOffset * speedMultiplier,
                color: color,
                points: points,
                flashFrames: 0
            });
        }

        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        function resetGame() {
            obstacles.length = 0;
            lasers.length = 0;
            particles.length = 0;
            score = 0;
            speedMultiplier = 1;
            player.x = canvas.width / 2 - 16;
            lastTouchX = null;
            gameOver = false;
            animate();
        }

        function animate() {
            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 15, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("SYSTEM DESTROYED", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "white";
                ctx.font = "18px sans-serif";
                ctx.fillText(`Final Combat Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#00ffff";
                ctx.font = "14px sans-serif";
                ctx.fillText("TAP TO REDEPLOY FIGHTER", canvas.width / 2, canvas.height / 2 + 75);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Particle Logic Loop
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0; // Standard layout reset

            // 2. Weapons Delivery Processing Pipeline
            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.y -= l.speed;
                ctx.fillStyle = l.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = l.color;
                ctx.fillRect(l.x, l.y, l.width, l.height);

                if (l.y < -20) lasers.splice(i, 1);
            }
            ctx.shadowBlur = 0;

            // 3. Render Interceptor Spacecraft
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // 4. Combat Simulation Matrix
            spawnTimer++;
            if (spawnTimer >= obstacleSpawnRate) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;
