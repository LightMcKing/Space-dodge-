<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Dodger Extreme</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050515;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 22px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
            color: #00ffff;
        }
        #gameCanvas {
            border: 3px solid #00ffff;
            background-color: #020208;
            box-shadow: 0 0 20px #00ffff;
            max-width: 95vw;
            max-height: 70vh;
            border-radius: 12px;
        }
        .instructions {
            margin: 10px 0;
            font-size: 13px;
            color: #88aaee;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>LASER DODGER</h1>
    <canvas id="gameCanvas" width="360" height="520"></canvas>
    <div class="instructions">Left Half: Drag to Move | Right Half: Tap to Shoot Lasers<br>Tap when defeated to restart.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameOver = false;
        let score = 0;
        let speedMultiplier = 1;

        // Player Space Ship
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 70,
            width: 32,
            height: 32,
            color: "#00ffff"
        };

        // Projectile & Asteroid Tracking Arrays
        const obstacles = [];
        const lasers = [];
        
        const obstacleSpawnRate = 30; 
        let spawnTimer = 0;

        // --- MULTI-TOUCH INPUT SYSTEMS ---
        function processTouches(e) {
            e.preventDefault();
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            
            // Loop through all active fingers on screen
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const canvasX = ((touch.clientX - rect.left) / rect.width) * canvas.width;

                // LEFT HALF OF SCREEN: Handles Ship Movement Tracking
                if (canvasX < canvas.width / 2) {
                    player.x = canvasX - player.width / 2;
                    // Prevent flying out of game boundaries
                    if (player.x < 0) player.x = 0;
                    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
                }
            }
        }

        // Tap Right side to trigger Weapon Fire
        canvas.addEventListener("touchstart", (e) => {
            if (gameOver) {
                resetGame();
                return;
            }

            const rect = canvas.getBoundingClientRect();
            // Look at the newest finger down
            const newestTouch = e.changedTouches[0];
            const canvasX = ((newestTouch.clientX - rect.left) / rect.width) * canvas.width;

            // RIGHT HALF OF SCREEN: Weapon System
            if (canvasX >= canvas.width / 2) {
                fireLaser();
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", processTouches, { passive: false });

        // Keyboard backup systems for testing
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                if (gameOver) resetGame();
                else fireLaser();
            }
            if (e.code === "ArrowLeft" && player.x > 0) player.x -= 15;
            if (e.code === "ArrowRight" && player.x < canvas.width - player.width) player.x += 15;
        });

        function fireLaser() {
            lasers.push({
                x: player.x + player.width / 2 - 2, // Centered on ship tip
                y: player.y,
                width: 4,
                height: 15,
                speed: 9,
                color: "#ff00ff"
            });
        }

        function resetGame() {
            obstacles.length = 0;
            lasers.length = 0;
            score = 0;
            speedMultiplier = 1;
            player.x = canvas.width / 2 - 15;
            gameOver = false;
            animate();
        }

        function spawnObstacle() {
            const size = Math.random() * 25 + 15;
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: (Math.random() * 2 + 2) * speedMultiplier,
                color: "#ff3366"
            });
        }

        // Box collision helper standard formula
        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        // Main Rendering Loop
        function animate() {
            if (gameOver) {
                ctx.fillStyle = "rgba(2, 2, 8, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("MISSION FAILED", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "white";
                ctx.font = "18px sans-serif";
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#00ffff";
                ctx.font = "14px sans-serif";
                ctx.fillText("TAP SCREEN TO DEPLOY AGAIN", canvas.width / 2, canvas.height / 2 + 70);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Move & Render Active Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.y -= l.speed; // Move up towards space

                ctx.fillStyle = l.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = l.color;
                ctx.fillRect(l.x, l.y, l.width, l.height);

                // Delete clean offscreen lasers
                if (l.y < -20) {
                    lasers.splice(i, 1);
                }
            }
            ctx.shadowBlur = 0; // Clear blur layer

            // 2. Render Player Ship (Cyan Neon Jet)
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // 3. Spawning & Handling Asteroids
            spawnTimer++;
            if (spawnTimer >= obstacleSpawnRate) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed; // Drop downward

                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Collision: Player vs Asteroid
                if (checkCollision(player, obs)) {
                    gameOver = true;
                }

                // Collision: Laser vs Asteroid
                for (let j = lasers.length - 1; j >= 0; j--) {
                    if (checkCollision(lasers[j], obs)) {
                        obstacles.splice(i, 1);
                        lasers.splice(j, 1);
                        score += 2; // Extra points for combat kills!
                        break; 
                    }
                }

                // Dodged cleanly past screen boundary
                if (obs && obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    if (score % 10 === 0) {
                        speedMultiplier += 0.15; // Scaled engine pacing
                    }
                }
            }

            // 4. Combat Dashboard HUD
            ctx.fillStyle = "white";
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(`SCORE: ${score}`, 20, 35);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
